<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Savezy – Save more. Waste less.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --bg: #f6f5fa;
            --surface: #fff;
            --ink: #1c1530;
            --mute: #6b6580;
            --line: #e4e0f0;
            --pri: #4c1d95;
            --pri-ink: #fff;
            --lav: #ede9fe;
            --ok: #0f7a4d;
            --okbg: #dcf5e8;
            --warn: #9a5b00;
            --warnbg: #fdeccc;
            --bad: #b4232c;
            --badbg: #fde0e1;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #130f1f;
                --surface: #1d1830;
                --ink: #efeaff;
                --mute: #a69fbd;
                --line: #322a4d;
                --pri: #a78bfa;
                --pri-ink: #150d2b;
                --lav: #2b2250;
                --ok: #5fd6a0;
                --okbg: #12362a;
                --warn: #f0b756;
                --warnbg: #3a2a0d;
                --bad: #ff8a90;
                --badbg: #401a1e;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #130f1f;
            --surface: #1d1830;
            --ink: #efeaff;
            --mute: #a69fbd;
            --line: #322a4d;
            --pri: #a78bfa;
            --pri-ink: #150d2b;
            --lav: #2b2250;
            --ok: #5fd6a0;
            --okbg: #12362a;
            --warn: #f0b756;
            --warnbg: #3a2a0d;
            --bad: #ff8a90;
            --badbg: #401a1e;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        a {
            color: var(--pri)
        }

        :focus-visible {
            outline: 3px solid var(--pri);
            outline-offset: 2px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: var(--surface);
            border-bottom: 1px solid var(--line)
        }

        .bar {
            max-width: 1040px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            flex-wrap: wrap
        }

        .logo {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -.5px;
            color: var(--pri);
            cursor: pointer;
            margin-right: auto;
            background: none;
            border: 0;
            padding: 0
        }

        nav {
            display: flex;
            gap: 2px;
            flex-wrap: wrap
        }

        nav button {
            background: none;
            border: 0;
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            color: var(--mute);
            font-weight: 500
        }

        nav button[aria-current="page"] {
            background: var(--lav);
            color: var(--pri)
        }

        nav .scan {
            background: var(--pri);
            color: var(--pri-ink);
            font-weight: 600
        }

        main {
            max-width: 1040px;
            margin: auto;
            padding: 20px 16px 90px
        }

        h1 {
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.1;
            letter-spacing: -1px;
            margin: 0 0 12px
        }

        h2 {
            font-size: 22px;
            letter-spacing: -.3px;
            margin: 28px 0 12px
        }

        h3 {
            margin: 0 0 4px;
            font-size: 17px
        }

        .btn {
            background: var(--pri);
            color: var(--pri-ink);
            border: 0;
            border-radius: 12px;
            padding: 11px 18px;
            font-weight: 600;
            cursor: pointer
        }

        .btn.alt {
            background: var(--lav);
            color: var(--pri)
        }

        .btn.sm {
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 10px
        }

        .btn.bad {
            background: var(--badbg);
            color: var(--bad)
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px
        }

        .hero {
            background: var(--pri);
            color: var(--pri-ink);
            border-radius: 24px;
            padding: clamp(22px, 5vw, 44px)
        }

        .hero p {
            max-width: 52ch;
            margin: 0 0 20px;
            opacity: .9
        }

        .hero .btn {
            background: var(--pri-ink);
            color: var(--pri)
        }

        .hero .btn.alt {
            background: transparent;
            color: var(--pri-ink);
            border: 1.5px solid currentColor
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .pill {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 999px;
            background: var(--lav);
            color: var(--pri)
        }

        .pill.ok {
            background: var(--okbg);
            color: var(--ok)
        }

        .pill.warn {
            background: var(--warnbg);
            color: var(--warn)
        }

        .pill.bad {
            background: var(--badbg);
            color: var(--bad)
        }

        .off {
            font-size: 26px;
            font-weight: 700;
            color: var(--pri);
            letter-spacing: -.5px
        }

        .mute {
            color: var(--mute);
            font-size: 14px
        }

        .listing {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            text-align: left;
            width: 100%
        }

        .listing:hover {
            border-color: var(--pri)
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin: 12px 0 4px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface)
        }

        .form {
            max-width: 560px
        }

        .chk {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-weight: 400
        }

        .chk input {
            width: auto;
            margin-top: 5px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px
        }

        th,
        td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        .scroll {
            overflow-x: auto
        }

        .note {
            background: var(--warnbg);
            color: var(--warn);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            margin: 12px 0
        }

        dialog {
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--surface);
            color: var(--ink);
            padding: 22px;
            max-width: 480px;
            width: calc(100% - 28px)
        }

        dialog::backdrop {
            background: rgba(20, 10, 40, .5)
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 50
        }

        #toast.on {
            opacity: 1
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .tabs button {
            border: 1px solid var(--line);
            background: var(--surface);
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer
        }

        .tabs button.on {
            background: var(--pri);
            color: var(--pri-ink);
            border-color: var(--pri)
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <button class="logo" onclick="go('home')" aria-label="Savezy home">Savezy</button>
            <nav id="nav"></nav>
        </div>
    </header>
    <main id="app"></main>
    <dialog id="dlg"></dialog>
    <div id="toast" role="status"></div>
    <script>
        const CATS = ['Food', 'Shopping', 'Entertainment', 'Travel', 'Subscriptions'];
        const TYPES = ['Gift card', 'E-voucher', 'Unique single-use code'];
        let L = [
            { id: 1, brand: 'QuickBite', cat: 'Food', type: 'E-voucher', off: 'Rs. 150 off', price: 90, exp: '2026-12-10', min: 399, elig: 'Orders above Rs. 399 on the QuickBite app', seller: 'Asha R.', st: 'approved', trend: 1 },
            { id: 2, brand: 'ShopMart', cat: 'Shopping', type: 'Gift card', off: 'Rs. 500 value', price: 430, exp: '2027-03-31', min: 0, elig: 'Any product, online and in store', seller: 'Karan S.', st: 'approved', trend: 1 },
            { id: 3, brand: 'CineHub', cat: 'Entertainment', type: 'Unique single-use code', off: 'Buy 1 get 1', price: 60, exp: '2026-11-20', min: 0, elig: 'Weekday shows, one use per code', seller: 'Meera P.', st: 'approved', trend: 1 },
            { id: 4, brand: 'TripNest', cat: 'Travel', type: 'E-voucher', off: 'Rs. 800 off', price: 520, exp: '2026-11-25', min: 3000, elig: 'Domestic bus and hotel bookings', seller: 'Dev T.', st: 'approved' },
            { id: 5, brand: 'StreamOn', cat: 'Subscriptions', type: 'Gift card', off: '3 months', price: 380, exp: '2027-01-15', min: 0, elig: 'New and existing accounts', seller: 'Nisha K.', st: 'approved', trend: 1 },
            { id: 6, brand: 'CafeLoop', cat: 'Food', type: 'E-voucher', off: 'Rs. 100 off', price: 55, exp: '2026-11-18', min: 249, elig: 'Dine-in and takeaway', seller: 'Ravi M.', st: 'approved' },
            { id: 7, brand: 'FitFuel', cat: 'Shopping', type: 'Unique single-use code', off: '25% off', price: 40, exp: '2026-12-31', min: 999, elig: 'Supplements, excluding bundles', seller: 'Isha G.', st: 'pending' }];
        const DEALS = [['Student discount: 20% off notebooks at ShopMart', 'Public offer, valid till 30 Nov'], ['Free delivery on QuickBite orders above Rs. 299', 'Public promo code, no sale needed'], ['CineHub weekday evening shows at Rs. 120', 'Public offer']];
        const PRODUCTS = {
            '8901234567890': {
                name: 'Crunchy Oats Biscuits', brand: 'NutriBite', variant: 'Original', size: '400 g', store: 250,
                exact: [{ s: 'Seller A', item: 219, del: 20, stock: 'In stock', t: '2 hours ago' }, { s: 'Seller B', item: 199, del: 40, stock: 'In stock', t: '5 hours ago' }],
                similar: [{ s: 'Seller A', n: 'NutriBite Original 200 g', item: 129, del: 20, t: '2 hours ago' }]
            },
            '8909876543210': {
                name: 'Cotton Notebook A5', brand: 'PaperTrail', variant: 'Ruled', size: '180 pages', store: 90,
                exact: [{ s: 'Seller C', item: 72, del: 0, stock: 'In stock', t: '1 hour ago' }], similar: []
            }
        };
        let S = { user: null, wish: new Set(), reqs: [], reports: [{ id: 1, lid: 3, why: 'Code may already be used' }], q: '', cat: 'All', view: 'home' };
        const $ = s => document.querySelector(s), inr = n => 'Rs. ' + n.toLocaleString('en-IN');
        function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400) }
        function days(d) { return Math.ceil((new Date(d) - new Date('2026-11-11')) / 864e5) }
        function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }
        function go(v) { location.hash = v }
        function nav() {
            const v = S.view, items = [['home', 'Home'], ['explore', 'Explore'], ['sell', 'Sell'], ['dashboard', 'My Savezy'], ['admin', 'Admin']];
            $('#nav').innerHTML = items.map(([k, n]) => `<button onclick="go('${k}')" ${v === k ? 'aria-current="page"' : ''}>${n}</button>`).join('') +
                `<button class="scan" onclick="go('scan')">Scan product</button><button onclick="${S.user ? 'logout()' : 'authDlg()'}">${S.user ? esc(S.user.name) + ' (log out)' : 'Log in'}</button>`
        }
        function card(l) {
            const d = days(l.exp); return `<button class="card listing" onclick="detail(${l.id})"><div class="row"><span class="pill">${l.cat}</span>${d <= 14 ? `<span class="pill warn">Expires in ${d} days</span>` : ''}</div>
<h3>${esc(l.brand)}</h3><div class="off">${esc(l.off)}</div><div class="mute">${esc(l.type)}</div><div><b>${inr(l.price)}</b> <span class="mute">Expires ${l.exp}</span></div></button>`
        }
        const approved = () => L.filter(l => l.st === 'approved');
        const V = {
            home() {
                const a = approved(); return `<section class="hero"><h1>Why pay more when you can Savezy?</h1><p>Find deals, list eligible unused vouchers and check if a product is cheaper online while you stand in the store.</p>
<div class="row"><button class="btn" onclick="go('explore')">Explore deals</button><button class="btn alt" onclick="go('scan')">Scan a product</button></div></section>
<h2>Trending vouchers</h2><div class="grid">${a.filter(l => l.trend).map(card).join('')}</div>
<h2>Expiring soon</h2><div class="grid">${[...a].sort((x, y) => days(x.exp) - days(y.exp)).slice(0, 3).map(card).join('')}</div>
<h2>Deals feed</h2><div class="grid">${DEALS.map(d => `<div class="card"><h3>${d[0]}</h3><div class="mute">${d[1]}</div></div>`).join('')}</div>
<h2>How it works</h2><div class="grid"><div class="card"><h3>List</h3><div class="mute">Submit an eligible, transferable voucher. An admin reviews it.</div></div><div class="card"><h3>Request</h3><div class="mute">Check expiry and conditions, then send a purchase request.</div></div><div class="card"><h3>Coordinate</h3><div class="mute">Buyer and seller arrange the transfer. Savezy processes no payment.</div></div></div>
<div class="note">Prototype: listings, products and prices are sample data, not live offers.</div>`},
            explore() {
                const r = approved().filter(l => (S.cat === 'All' || l.cat === S.cat) && (l.brand + l.off + l.type).toLowerCase().includes(S.q.toLowerCase()));
                return `<h1>Explore</h1><input id="q" placeholder="Search brand or offer" value="${esc(S.q)}" aria-label="Search" oninput="S.q=this.value;list()">
<div class="tabs" style="margin-top:12px">${['All', ...CATS].map(c => `<button class="${S.cat === c ? 'on' : ''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div><div id="list" class="grid"></div>`
            },
            scan() {
                return `<h1>Savezy Scan</h1><p class="mute">Enter the barcode number from the pack. Camera scanning comes in the live build.</p>
<div class="card form"><label for="bc">Barcode (EAN)</label><input id="bc" inputmode="numeric" placeholder="e.g. 8901234567890"><div class="row" style="margin-top:12px"><button class="btn" onclick="scan($('#bc').value)">Compare prices</button>
<button class="btn alt" onclick="scan('8901234567890')">Try sample 1</button></div></div><div id="res"></div>`},
            sell() {
                return `<h1>Sell a voucher</h1><div class="form card"><p class="mute">Only vouchers whose terms allow transfer can be listed. Never share the private code here.</p>
<label>Brand<input id="sb"></label><label>Type<select id="st">${TYPES.map(t => `<option>${t}</option>`)}</select></label><label>Category<select id="sc">${CATS.map(t => `<option>${t}</option>`)}</select></label>
<label>Discount or value<input id="so" placeholder="Rs. 200 off"></label><label>Selling price (Rs.)<input id="sp" type="number" min="1"></label><label>Expiry date<input id="se" type="date"></label>
<label>Minimum spend (Rs.)<input id="sm" type="number" min="0" value="0"></label><label>Eligible products or conditions<textarea id="sx" rows="2"></textarea></label>
<label class="chk"><input type="checkbox" id="sk">I confirm this voucher is unused, not tied to my account or phone number, and its terms allow transfer.</label>
<div style="margin-top:16px"><button class="btn" onclick="submitSell()">Submit for review</button></div></div>`},
            dashboard() {
                if (!S.user) return gate('Log in to see your listings, requests and saved offers.');
                const mine = L.filter(l => l.seller === S.user.name), w = L.filter(l => S.wish.has(l.id));
                return `<h1>My Savezy</h1><h2>My listings</h2>${mine.length ? `<div class="scroll"><table><tr><th>Offer</th><th>Status</th></tr>${mine.map(l => `<tr><td>${esc(l.brand)} – ${esc(l.off)}</td><td><span class="pill ${l.st === 'approved' ? 'ok' : 'warn'}">${l.st === 'approved' ? 'Live' : 'In review'}</span></td></tr>`).join('')}</table></div>` : '<p class="mute">No listings yet. Use Sell to add one.</p>'}
<h2>Requests I sent</h2>${reqTable(S.reqs.filter(r => r.buyer === S.user.name), 'buyer')}
<h2>Requests I received</h2>${reqTable(S.reqs.filter(r => L.find(l => l.id === r.lid).seller === S.user.name), 'seller')}
<h2>Saved offers</h2><div class="grid">${w.length ? w.map(card).join('') : '<p class="mute">Tap Save on any offer to keep it here.</p>'}</div>`
            },
            admin() {
                const p = L.filter(l => l.st === 'pending');
                return `<h1>Admin review</h1><div class="note">Prototype only: the live build restricts this page to admin accounts. Review checks completeness and eligibility evidence. It does not guarantee redemption.</div>
<h2>Pending listings</h2>${p.length ? p.map(l => `<div class="card" style="margin-bottom:10px"><h3>${esc(l.brand)} – ${esc(l.off)}</h3><div class="mute">${esc(l.type)} · ${inr(l.price)} · Expires ${l.exp}<br>${esc(l.elig)}</div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="review(${l.id},1)">Approve</button><button class="btn sm bad" onclick="review(${l.id},0)">Reject</button></div></div>`).join('') : '<p class="mute">Nothing waiting for review.</p>'}
<h2>Reports</h2>${S.reports.length ? S.reports.map(r => { const l = L.find(x => x.id === r.lid); return `<div class="card" style="margin-bottom:10px"><h3>${esc(l.brand)} – ${esc(l.off)}</h3><div class="mute">Reason: ${esc(r.why)}</div><div class="row" style="margin-top:10px"><button class="btn sm bad" onclick="takedown(${r.id})">Take down listing</button><button class="btn sm alt" onclick="dismiss(${r.id})">Dismiss report</button></div></div>` }).join('') : '<p class="mute">No open reports.</p>'}`
            }
        };
        function gate(m) { return `<div class="card form"><h2 style="margin-top:0">Log in required</h2><p class="mute">${m}</p><button class="btn" onclick="authDlg()">Log in or register</button></div>` }
        function reqTable(rs, role) {
            if (!rs.length) return '<p class="mute">None yet.</p>';
            return `<div class="scroll"><table><tr><th>Offer</th><th>Status</th><th></th></tr>${rs.map(r => { const l = L.find(x => x.id === r.lid); return `<tr><td>${esc(l.brand)} – ${esc(l.off)}</td><td><span class="pill ${r.s === 'Declined' ? 'bad' : r.s === 'Completed' ? 'ok' : 'warn'}">${r.s}</span></td><td>${role === 'seller' && r.s === 'Requested' ? `<button class="btn sm" onclick="setReq(${r.id},'Accepted')">Accept</button> <button class="btn sm bad" onclick="setReq(${r.id},'Declined')">Decline</button>` : ''}${r.s === 'Accepted' ? `<button class="btn sm alt" onclick="setReq(${r.id},'Completed')">Mark transfer done</button>` : ''}</td></tr>` }).join('')}</table></div>`
        }
        function list() {
            const r = approved().filter(l => (S.cat === 'All' || l.cat === S.cat) && (l.brand + l.off + l.type).toLowerCase().includes(S.q.toLowerCase()));
            $('#list').innerHTML = r.length ? r.map(card).join('') : '<p class="mute">No offers match. Try another word or category.</p>'
        }
        function render() { S.view = location.hash.slice(1) || 'home'; if (!V[S.view]) S.view = 'home'; nav(); $('#app').innerHTML = V[S.view](); if (S.view === 'explore') list(); window.scrollTo(0, 0) }
        function detail(id) {
            const l = L.find(x => x.id === id), d = days(l.exp);
            $('#dlg').innerHTML = `<h2 style="margin-top:0">${esc(l.brand)}: ${esc(l.off)}</h2><div class="row"><span class="pill">${l.type}</span><span class="pill ${d <= 14 ? 'warn' : 'ok'}">Expires ${l.exp}</span></div>
<p><b>${inr(l.price)}</b> · Seller ${esc(l.seller)}</p><p class="mute">Minimum spend: ${l.min ? inr(l.min) : 'none'}<br>Eligible: ${esc(l.elig)}<br>Listed after admin review of eligibility details. Review does not guarantee redemption. The code is shared only after the seller accepts.</p>
<div class="note">A purchase request is not a payment and not proof of transfer. Savezy processes no payment in this version.</div>
<div class="row"><button class="btn" onclick="request(${id})">Send purchase request</button><button class="btn alt" onclick="save(${id})">${S.wish.has(id) ? 'Remove from saved' : 'Save'}</button><button class="btn alt" onclick="report(${id})">Report</button><button class="btn alt" onclick="$('#dlg').close()">Close</button></div>`; $('#dlg').showModal()
        }
        function authDlg() {
            $('#dlg').innerHTML = `<h2 style="margin-top:0">Log in or register</h2><p class="mute">Prototype sign-in: no password is stored.</p><label>Name<input id="an" autocomplete="name"></label><label>Email<input id="ae" type="email" autocomplete="email"></label>
<div class="row" style="margin-top:14px"><button class="btn" onclick="login()">Continue</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`; $('#dlg').showModal()
        }
        function login() { const n = $('#an').value.trim(), e = $('#ae').value.trim(); if (!n || !/\S+@\S+/.test(e)) return toast('Enter your name and a valid email'); S.user = { name: n, email: e }; $('#dlg').close(); toast('Logged in as ' + n); render() }
        function logout() { S.user = null; toast('Logged out'); render() }
        function need() { if (S.user) return true; $('#dlg').close(); authDlg(); return false }
        function request(id) {
            if (!need()) return; const l = L.find(x => x.id === id); if (l.seller === S.user.name) return toast('You cannot request your own listing');
            S.reqs.push({ id: Date.now(), lid: id, buyer: S.user.name, s: 'Requested' }); $('#dlg').close(); toast('Request sent. The seller will respond.')
        }
        function save(id) { S.wish.has(id) ? S.wish.delete(id) : S.wish.add(id); $('#dlg').close(); toast(S.wish.has(id) ? 'Saved' : 'Removed from saved') }
        function report(id) { const why = prompt('What is wrong with this listing?'); if (!why) return; S.reports.push({ id: Date.now(), lid: id, why }); $('#dlg').close(); toast('Report sent to admin') }
        function setReq(id, s) { S.reqs.find(r => r.id === id).s = s; toast('Status: ' + s); render() }
        function submitSell() {
            if (!S.user) { authDlg(); return }
            const v = i => $(i).value.trim(), b = v('#sb'), o = v('#so'), p = +v('#sp'), e = v('#se');
            if (!b || !o || !p || !e) return toast('Fill in brand, discount, price and expiry');
            if (days(e) < 1) return toast('Expiry date must be in the future');
            if (!$('#sk').checked) return toast('Confirm the voucher is transferable to continue');
            L.push({ id: Date.now(), brand: b, cat: $('#sc').value, type: $('#st').value, off: o, price: p, exp: e, min: +v('#sm') || 0, elig: v('#sx') || 'Not specified', seller: S.user.name, st: 'pending' }); toast('Submitted for admin review'); go('dashboard')
        }
        function review(id, ok) { const l = L.find(x => x.id === id); if (ok) l.st = 'approved'; else L = L.filter(x => x.id !== id); toast(ok ? 'Approved and live' : 'Rejected'); render() }
        function takedown(rid) { const r = S.reports.find(x => x.id === rid); L = L.filter(l => l.id !== r.lid); S.reports = S.reports.filter(x => x.lid !== r.lid); toast('Listing taken down'); render() }
        function dismiss(rid) { S.reports = S.reports.filter(x => x.id !== rid); toast('Report dismissed'); render() }
        function scan(code) {
            code = (code || '').replace(/\D/g, ''); const p = PRODUCTS[code], el = $('#res');
            if (!p) { el.innerHTML = `<div class="card form" style="margin-top:14px"><h3>No reliable match</h3><p class="mute">We could not identify this barcode, so we show no prices. Try the sample barcode, or search by name in Explore.</p></div>`; return }
            const row = (s, it, dl, t) => `<tr><td>${s}</td><td>${inr(it)}</td><td>${dl ? inr(dl) : 'Free'}</td><td><b>${inr(it + dl)}</b></td><td class="mute">${t}</td></tr>`;
            el.innerHTML = `<div class="card" style="margin-top:14px"><span class="pill ok">Exact match</span><h3 style="margin-top:8px">${p.name}</h3><div class="mute">${p.brand} · ${p.variant} · ${p.size}</div>
<h2>Online offers</h2><div class="scroll"><table><tr><th>Source</th><th>Item</th><th>Delivery</th><th>Total</th><th>Price last checked</th></tr>
<tr><td>Local store (you entered)</td><td>${inr(p.store)}</td><td>–</td><td><b>${inr(p.store)}</b></td><td class="mute">Today</td></tr>${p.exact.map(x => row(x.s, x.item, x.del, x.t)).join('')}</table></div>
${p.similar.length ? `<h2>Similar product (not an exact match)</h2><div class="scroll"><table>${p.similar.map(x => `<tr><td>${x.n}</td><td>${x.s}</td><td><b>${inr(x.item + x.del)}</b></td><td><span class="pill warn">Similar product</span></td></tr>`).join('')}</table></div>` : ''}
<div class="note">Sample data for this prototype. In the live build, always confirm the final price on the retailer’s checkout page.</div></div>`}
        addEventListener('hashchange', render); render();
    </script>
</body>

</html>
