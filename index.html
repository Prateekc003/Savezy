<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Savezy – Save more. Waste less.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <style>
       /* Savezy redesign: presentation only. Replace the whole <style> block contents with this.
   All existing class names, CSS variables and dark mode are preserved. */
:root{
  --bg:#f7f6fb;--surface:#fff;--ink:#1c1530;--mute:#6b6580;--line:#e8e4f3;
  --pri:#5b21b6;--pri2:#7c3aed;--pri-ink:#fff;--lav:#f0ebff;--accent:#ff7a45;
  --ok:#0f7a4d;--okbg:#dcf5e8;--warn:#9a5b00;--warnbg:#fdeccc;--bad:#b4232c;--badbg:#fde0e1;
  --shadow:0 1px 2px rgba(40,20,90,.06),0 8px 24px rgba(40,20,90,.07);
  --shadow-h:0 2px 4px rgba(40,20,90,.08),0 16px 36px rgba(76,29,149,.16);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130f1f;--surface:#1d1830;--ink:#efeaff;--mute:#a69fbd;--line:#322a4d;--pri:#a78bfa;--pri2:#c4b5fd;--pri-ink:#150d2b;--lav:#2b2250;
  --ok:#5fd6a0;--okbg:#12362a;--warn:#f0b756;--warnbg:#3a2a0d;--bad:#ff8a90;--badbg:#401a1e;--shadow:0 8px 24px rgba(0,0,0,.35);--shadow-h:0 16px 36px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f1f;--surface:#1d1830;--ink:#efeaff;--mute:#a69fbd;--line:#322a4d;--pri:#a78bfa;--pri2:#c4b5fd;--pri-ink:#150d2b;--lav:#2b2250;
  --ok:#5fd6a0;--okbg:#12362a;--warn:#f0b756;--warnbg:#3a2a0d;--bad:#ff8a90;--badbg:#401a1e;--shadow:0 8px 24px rgba(0,0,0,.35);--shadow-h:0 16px 36px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;letter-spacing:-.8px;cursor:pointer;margin-right:auto;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;border:0;padding:0}
.logo::after{content:".";-webkit-text-fill-color:var(--accent);color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 13px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:500;transition:background .2s,color .2s}
nav button:hover{background:var(--lav);color:var(--pri)}
nav button[aria-current="page"]{background:var(--lav);color:var(--pri);font-weight:600}
@media (max-width:640px){
  .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  nav{flex-wrap:nowrap;white-space:nowrap}
  nav button{padding:8px 11px;font-size:14px}}

main{max-width:1120px;margin:auto;padding:20px 16px 90px}
h1{font-size:clamp(30px,5.5vw,52px);line-height:1.05;letter-spacing:-1.5px;font-weight:800;margin:0 0 12px}
h2{font-size:22px;letter-spacing:-.4px;font-weight:700;margin:36px 0 14px}
h3{margin:0 0 4px;font-size:17px;font-weight:600}

/* Buttons */
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(91,33,182,.25);transition:transform .15s,box-shadow .2s,filter .2s;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(91,33,182,.3);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.alt{background:var(--lav);color:var(--pri);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:10px;min-height:36px}
.btn.bad{background:var(--badbg);color:var(--bad);box-shadow:none}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}

/* Voucher / coupon card */
.listing{position:relative;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;overflow:hidden;padding-top:20px}
.listing::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--accent))}
.listing:hover{border-color:var(--pri2);transform:translateY(-4px);box-shadow:var(--shadow-h)}
.listing:active{transform:translateY(-1px)}
.listing .off{margin:2px 0}
.ticket-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;padding-top:12px;border-top:2px dashed var(--line)}
.ticket-foot b{font-size:18px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--lav);color:var(--pri)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.off{font-size:28px;font-weight:800;color:var(--pri);letter-spacing:-.8px;line-height:1.1}
.mute{color:var(--mute);font-size:14px}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 55%,#8b5cf6 100%);color:#fff;border-radius:28px;padding:clamp(26px,6vw,56px);box-shadow:0 20px 50px rgba(76,29,149,.3)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:340px;height:340px;right:-90px;top:-110px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.hero::after{width:240px;height:240px;right:12%;bottom:-120px;background:radial-gradient(circle,rgba(255,122,69,.45),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;max-width:16ch}
.hero p{max-width:52ch;margin:0 0 22px;opacity:.92;font-size:clamp(16px,2.2vw,19px)}
.hero .btn{background:#fff;color:#4c1d95;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero .btn.alt{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.7);box-shadow:none}
.hero-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px}
@media (max-width:560px){.hero-float{top:18px;transform:none;font-size:52px;opacity:.35}}
@keyframes bob{50%{transform:translateY(calc(-50% - 10px))}}
@media (max-width:560px){@keyframes bob{50%{transform:translateY(-8px)}}}

/* Category tiles (home) */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.cat-tile span{font-size:30px;line-height:1}
.cat-tile:hover{transform:translateY(-3px);border-color:var(--pri2);box-shadow:var(--shadow-h)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Forms */
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri2) 20%,transparent)}
.form{max-width:600px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.chk input{width:auto;margin-top:5px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.scroll{overflow-x:auto}
.note{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:11px 15px;font-size:14px;margin:14px 0}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;max-width:480px;width:calc(100% - 28px);box-shadow:0 30px 80px rgba(20,10,40,.35);animation:pop .22s ease}
dialog::backdrop{background:rgba(20,10,40,.55);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;box-shadow:var(--shadow-h)}
#toast.on{opacity:1}

/* Tabs / filters */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:500;transition:all .2s}
.tabs button:hover{border-color:var(--pri2);color:var(--pri)}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink);border-color:transparent}
#q{padding:14px 18px;border-radius:16px;box-shadow:var(--shadow);font-size:16px}

/* Footer */
.site-footer{max-width:1120px;margin:20px auto 0;padding:28px 16px;border-top:1px solid var(--line);text-align:center;color:var(--mute)}
.site-footer a{margin:0 12px;text-decoration:none;font-size:14px;color:var(--mute);transition:color .2s}
.site-footer a:hover{color:var(--pri)}

/* Entrance animation + skeleton */
main>*{animation:rise .45s ease both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.skeleton{background:linear-gradient(90deg,var(--lav) 25%,var(--line) 50%,var(--lav) 75%);background-size:200% 100%;animation:shine 1.3s infinite;border-radius:12px;min-height:120px}
@keyframes shine{to{background-position:-200% 0}}

[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

    </style>
    <script type="module" src="./js/firebase-auth.js"></script>
</head>

<body>
    <header>
        <div class="bar">
            <button class="logo" onclick="go('home')" aria-label="Savezy home">Savezy</button>
            <nav id="nav"></nav>
        </div>
    </header>
    <main id="app"></main>
    <footer class="site-footer">
    <p><strong>Savezy</strong> – Save more. Waste less.</p>

    <div>
        <a href="#about">About Us</a>
        <a href="#contact">Contact Us</a>
        <a href="#privacy">Privacy Policy</a>
    </div>

    <p class="mute">© 2026 Savezy. All rights reserved.</p>
</footer>
    <dialog id="dlg"></dialog>
    <div id="toast" role="status"></div>
    <script>
        const CATS = ['Food', 'Shopping', 'Entertainment', 'Travel', 'Subscriptions'];
        const SELLTYPES = ['Gift card', 'E-voucher', 'Unique single-use code', 'Account or phone-bound offer', 'Bank or card offer', 'Cashback or loyalty points'], BLOCKED = SELLTYPES.slice(3);
        const TYPES = ['Gift card', 'E-voucher', 'Unique single-use code'];
        let L = [];
        let P = [];

        const DEALS = [['Student discount: 20% off notebooks at ShopMart', 'Public offer, valid till 30 Nov'], ['Free delivery on QuickBite orders above Rs. 299', 'Public promo code, no sale needed'], ['CineHub weekday evening shows at Rs. 120', 'Public offer']];
        let S = { user: null, admin: false, wish: new Set(), reqs: [], reports: [{ id: 1, lid: 3, why: 'Code may already be used' }], q: '', cat: 'All', view: 'home' };
        const $ = s => document.querySelector(s), inr = n => 'Rs. ' + n.toLocaleString('en-IN');
        function persist() { try { localStorage.setItem('sz1', JSON.stringify({ L, reqs: S.reqs, wish: [...S.wish], reports: S.reports })) } catch (e) { } }
        function toast(m) { persist(); const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400) }
        function days(d) { return Math.ceil((new Date(d) - new Date('2026-11-11')) / 864e5) }
        function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }
        function go(v) { location.hash = v }
        function nav() {
            const v = S.view, items = [['home', 'Home'], ['explore', 'Explore'], ['sell', 'Sell'], ['requests', 'Requests' + (pend() ? ' (' + pend() + ')' : '')], ['dashboard', 'My Savezy'], ['admin', 'Admin']];
            $('#nav').innerHTML = items.map(([k, n]) => `<button onclick="go('${k}')" ${v === k ? 'aria-current="page"' : ''}>${n}</button>`).join('') +
                `<button onclick="${S.user ? 'logout()' : 'authDlg()'}">${S.user ? esc(S.user.name) + ' (log out)' : 'Log in'}</button>`
        }
        const CE = { Food: '🍔', Shopping: '🛍️', Entertainment: '🎬', Travel: '✈️', Subscriptions: '🔁' };
function card(l) {
    const d = days(l.exp);
    return `<button class="card listing" onclick="detail('${esc(String(l.id))}')">
<div class="row"><span class="pill">${CE[l.cat] || '🏷️'} ${l.cat}</span>${d <= 14 ? `<span class="pill warn">Expires in ${d} days</span>` : ''}</div>
<h3>${esc(l.brand)}</h3><div class="off">${esc(l.off)}</div><div class="mute">${esc(l.type)}</div>
<div class="ticket-foot"><b>${inr(l.price)}</b><span class="mute">Expires ${l.exp}</span></div></button>`
}
        const approved = () => L.filter(l => l.st === 'approved' && days(l.exp) >= 0);
        const V = {
            home() {
                const a = approved(); return `<section class="hero"><span class="hero-badge">🎓 Made for students & bachelors</span>
<h1>Why pay more when you can Savezy?</h1><p>Find deals and list eligible unused vouchers.</p>
<div class="row"><button class="btn" onclick="go('explore')">Explore deals</button><button class="btn alt" onclick="go('sell')">Sell a voucher</button></div>
<svg class="hero-art" viewBox="0 0 280 220" aria-hidden="true"><defs><mask id="tk"><rect width="200" height="110" rx="16" fill="#fff"/><circle cx="0" cy="55" r="12"/><circle cx="200" cy="55" r="12"/><circle cx="130" cy="0" r="9"/><circle cx="130" cy="110" r="9"/></mask></defs><g transform="translate(36 34) rotate(-9 100 55)" opacity=".28"><rect width="200" height="110" rx="16" fill="#fff"/></g><g transform="translate(56 64) rotate(5 100 55)"><g mask="url(#tk)"><rect width="200" height="110" rx="16" fill="#fff"/><text x="22" y="40" font-size="11" font-weight="700" letter-spacing="2" fill="#7c3aed">VOUCHER</text><text x="22" y="80" font-size="36" font-weight="800" fill="#4c1d95">SAVE</text><line x1="130" y1="14" x2="130" y2="96" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 5"/><circle cx="165" cy="55" r="24" fill="#ff7a45"/><text x="165" y="67" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">%</text></g></g><circle cx="244" cy="44" r="18" fill="#fbbf24"/><circle cx="244" cy="44" r="13" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><text x="244" y="51" text-anchor="middle" font-size="18" font-weight="800" fill="#92400e">₹</text><circle cx="30" cy="30" r="4" fill="#fff" opacity=".7"/><circle cx="262" cy="150" r="3" fill="#fff" opacity=".6"/><circle cx="20" cy="170" r="5" fill="#fff" opacity=".4"/></svg>
<h2>Browse by category</h2><div class="cats">${CATS.map(c => `<button class="cat-tile" onclick="S.cat='${c}';go('explore')"><span>${CE[c]}</span>${c}</button>`).join('')}</div>`},
            explore() {
                const r = approved().filter(l => (S.cat === 'All' || l.cat === S.cat) && (l.brand + l.off + l.type).toLowerCase().includes(S.q.toLowerCase()));
                return `<h1>Explore</h1><input id="q" placeholder="Search brand or offer" value="${esc(S.q)}" aria-label="Search" oninput="S.q=this.value;list()">
<div class="tabs" style="margin-top:12px">${['All', ...CATS].map(c => `<button class="${S.cat === c ? 'on' : ''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div><div class="row" style="margin-bottom:12px"><label class="mute" style="margin:0">Sort <select style="width:auto" onchange="S.sort=this.value;list()"><option value="soon">Expiring soonest</option><option value="price" ${S.sort === 'price' ? 'selected' : ''}>Price, low to high</option><option value="new" ${S.sort === 'new' ? 'selected' : ''}>Newest</option></select></label><label class="mute" style="margin:0">Expires within <select style="width:auto" onchange="S.exp=this.value;list()">${[['all', 'Any time'], ['7', '7 days'], ['14', '14 days'], ['30', '30 days']].map(([v, t]) => `<option value="${v}" ${S.exp === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label><label class="mute" style="margin:0">Type <select style="width:auto" onchange="S.typ=this.value;list()">${['all', ...TYPES].map(t => `<option value="${t}" ${S.typ === t ? 'selected' : ''}>${t === 'all' ? 'All types' : t}</option>`).join('')}</select></label></div><div id="list" class="grid"></div>`
            },
            sell() {
                return `<h1>Sell a voucher</h1><div class="form card"><p class="mute">Only vouchers whose terms allow transfer can be listed. Never share the private code here.</p>
<label>Brand<input id="sb"></label><label>What kind of offer is it?<select id="st">${SELLTYPES.map(t => `<option>${t}</option>`).join('')}</select></label><p class="mute" style="margin:4px 0 0">Offers tied to an account, phone number or card cannot be listed.</p><label>Category<select id="sc">${CATS.map(t => `<option>${t}</option>`).join('')}</select></label>
<label>Discount or value<input id="so" placeholder="Rs. 200 off"></label><label>Selling price (Rs.)<input id="sp" type="number" min="1"></label><label>Expiry date<input id="se" type="date"></label>
<label>Minimum spend (Rs.)<input id="sm" type="number" min="0" value="0"></label><label>Eligible products or conditions<textarea id="sx" rows="2"></textarea></label><label>Voucher code (kept private until you release it)<input id="scode" autocomplete="off"></label>
<label>Where did you get it, and what do its terms say about transfer?<textarea id="sv" rows="2" placeholder="e.g. Bought as a gift card on the brand site. Terms say gift cards are transferable."></textarea></label>
<label class="chk"><input type="checkbox" id="sk">This voucher is unused.</label><label class="chk"><input type="checkbox" id="sk2">It is not tied to my account, phone number, email or card.</label><label class="chk"><input type="checkbox" id="sk3">Its terms allow it to be transferred or resold.</label>
<div style="margin-top:16px"><button class="btn" onclick="submitSell()">Submit for review</button></div></div>`},
            dashboard() {
                if (!S.user) return gate('Log in to see your listings, requests and saved offers.');
                const mine = L.filter(l => l.seller === S.user.name), w = L.filter(l => S.wish.has(l.id));
                return `<h1>My Savezy</h1><h2>My listings</h2>${mine.length ? `<div class="scroll"><table><tr><th>Offer</th><th>Status</th><th></th></tr>${mine.map(l => `<tr><td>${esc(l.brand)} – ${esc(l.off)}</td><td><span class="pill ${l.st === 'approved' ? 'ok' : l.st === 'sold' ? '' : 'warn'}">${l.st === 'approved' ? 'Live' : l.st === 'sold' ? 'Sold' : 'In review'}</span></td><td>${l.st === 'approved' ? `<button class="btn sm alt" onclick="mark('${esc(String(l.id))}','sold')">Mark sold</button> ` : ''}<button class="btn sm bad" onclick="mark('${esc(String(l.id))}','del')">Remove</button></td></tr>`).join('')}</table></div>` : '<p class="mute">No listings yet. Use Sell to add one.</p>'}
<h2>Requests I sent</h2>${reqTable(S.reqs.filter(r => r.buyer === S.user.name), 'buyer')}
<h2>Requests I received</h2>${reqTable(S.reqs.filter(r => L.find(l => l.id === r.lid).seller === S.user.name), 'seller')}
<h2>Saved offers</h2><div class="grid">${w.length ? w.map(card).join('') : '<p class="mute">Tap Save on any offer to keep it here.</p>'}</div>`
            },
            requests() {
                if (!S.user) return gate('Log in to see requests for your listings.');
                const rs = S.reqs.filter(mine).sort((a, b) => b.id - a.id);
                return `<h1>Requests for my listings</h1><p class="mute">Savezy processes no payment. Agree payment with the buyer yourself, then release the code.</p>${rs.length ? rs.map(r => { const l = L.find(x => x.id === r.lid); return `<div class="card" style="margin-bottom:10px"><div class="row"><h3 style="margin:0">${esc(l.brand)}: ${esc(l.off)}</h3><span class="pill ${RC[r.s] || ''}">${r.s}</span></div><p class="mute" style="margin:6px 0">From ${esc(r.buyer)}, ${new Date(r.id).toLocaleString('en-IN')}. Your price ${inr(l.price)}.</p>${acts(r)}</div>` }).join('') : `<div class="card"><p class="mute">No requests yet. When a buyer asks for one of your offers, it appears here and the Requests count in the menu goes up.</p><p class="mute">Testing alone? Log in with the seller name on a sample listing (for example Asha R.), then log out and send a request from another name.</p></div>`}`
            },
            admin() {
                if (!S.user) return gate('Log in with your administrator account to review coupons.');
                if (!S.admin) return `<h1>Admin review</h1><div class="note">This account is not registered as a Savezy administrator. Ask the project owner to add your Firebase UID to the admins collection.</div>`;
                return `<h1>Admin review</h1><div class="note">Review coupon details and private eligibility evidence. Approval does not guarantee redemption.</div>
<h2>Pending listings</h2>${P.length ? P.map(l => `<div class="card" style="margin-bottom:10px"><h3>${esc(l.brand)} – ${esc(l.off)}</h3><div class="mute">${esc(l.type)} · ${inr(l.price)} · Expires ${esc(l.exp)}<br>Seller: ${esc(l.seller || 'Unknown')}<br>${esc(l.elig || '')}<br><b>Evidence:</b> ${esc(l.evidence || 'Evidence not found')}</div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="review('${esc(l.id)}',1)">Approve</button><button class="btn sm bad" onclick="review('${esc(l.id)}',0)">Reject</button></div></div>`).join('') : '<p class="mute">Nothing waiting for review.</p>'}
<h2>Reports</h2><p class="mute">Firestore reports will be connected in a later step.</p>`
            },

            about() {
                return `
                    <div class="card">
                        <h1>About Savezy</h1>
                        <p>
                            Savezy is a platform designed to help people save money
                            by discovering deals, comparing product prices and
                            finding eligible unused vouchers.
                        </p>

                        <h2>Our purpose</h2>
                        <p>
                            We want to make shopping smarter and help users
                            make better purchasing decisions.
                        </p>

                        <h2>What Savezy offers</h2>
                        <ul>
                            <li>Discover available voucher offers.</li>
                            <li>List eligible unused transferable vouchers.</li>
                        </ul>

                    </div>
                `;
            },

            contact() {
                return `
                    <div class="card form">
                        <h1>Contact Us</h1>
                        <p>
                            Have a question, suggestion or problem with Savezy?
                            We would like to hear from you.
                        </p>

                        <h2>Get in touch</h2>
                        <p>
                            Email:
                            <a href="mailto:YOUR_EMAIL@example.com">
                                rahulks14322@example.com
                            </a>
                        </p>

                        <p class="mute">
                            Replace YOUR_EMAIL@example.com with your actual
                            Savezy support email address before publishing.
                        </p>
                    </div>
                `;
            },

            privacy() {
                return `
                    <div class="card">
                        <h1>Privacy Policy</h1>
                        <p><b>Last updated:</b> 11 November 2026</p>

                        <p>
                            Savezy respects your privacy. This policy explains
                            what information may be used when you access
                            our website.
                        </p>

                        <h2>1. Information we collect</h2>
                        <p>
                            When you register, we use your name and email
                            address to create and manage your account.
                        </p>
                        <p>
                            If you use voucher features, information such as
                            voucher details, listing information and requests
                            may be stored to operate the service.
                        </p>

                        <h2>2. How we use information</h2>
                        <ul>
                            <li>To create and manage user accounts.</li>
                            <li>To display and manage voucher listings.</li>
                            <li>To handle buyer and seller requests.</li>
                            <li>To improve the Savezy service.</li>
                        </ul>

                        <h2>3. Firebase services</h2>
                        <p>
                            Savezy uses Google Firebase Authentication and
                            Cloud Firestore for account authentication and
                            application data storage.
                        </p>

                        <h2>4. Local storage</h2>
                        <p>
                            The website may use your browser's local storage
                            to retain certain application information.
                        </p>

                        <h2>5. Third-party services</h2>
                        <p>
                            Our website is hosted through Netlify and uses
                            Firebase services. Those providers may process
                            information according to their own privacy policies.
                        </p>

                        <h2>6. Data security</h2>
                        <p>
                            We use Firebase security rules and other
                            appropriate measures to help protect application
                            information. No online service can guarantee
                            absolute security.
                        </p>

                        <h2>7. Contact</h2>
                        <p>
                            For privacy-related questions, contact:
                            YOUR_EMAIL@example.com
                        </p>
                    </div>
                `;
            }

        };
        const RC = { Requested: 'warn', Accepted: 'warn', 'Code released': 'ok', Completed: 'ok', Declined: 'bad' };
        function mine(r) { const l = L.find(x => x.id === r.lid); return !!(l && S.user && l.seller === S.user.name) }
        function pend() { return S.user ? S.reqs.filter(r => r.s === 'Requested' && mine(r)).length : 0 }
        function acts(r) {
            const b = (s, t, c = '') => `<button class="btn sm ${c}" onclick="setReq(${r.id},'${s}')">${t}</button>`;
            return r.s === 'Requested' ? `<div class="row">${b('Accepted', 'Accept')}${b('Declined', 'Decline', 'bad')}</div>` : r.s === 'Accepted' ? `<p class="mute">Agree payment with the buyer outside Savezy. Release the code only after you are paid.</p>${b('Code released', 'Release code')}` : r.s === 'Code released' ? `<p class="mute">The buyer can now see the code.</p>${b('Completed', 'Mark transfer done', 'alt')}` : ''
        }
        function gate(m) { return `<div class="card form"><h2 style="margin-top:0">Log in required</h2><p class="mute">${m}</p><button class="btn" onclick="authDlg()">Log in or register</button></div>` }
        function reqTable(rs, role) {
            if (!rs.length) return '<p class="mute">None yet.</p>';
            return `<div class="scroll"><table><tr><th>Offer</th><th>Status</th><th></th></tr>${rs.map(r => { const l = L.find(x => x.id === r.lid); return `<tr><td>${esc(l.brand)} – ${esc(l.off)}</td><td><span class="pill ${r.s === 'Declined' ? 'bad' : r.s === 'Completed' ? 'ok' : 'warn'}">${r.s}</span></td><td>${role === 'seller' && r.s === 'Requested' ? `<button class="btn sm" onclick="setReq(${r.id},'Accepted')">Accept</button> <button class="btn sm bad" onclick="setReq(${r.id},'Declined')">Decline</button>` : ''}${r.s === 'Accepted' && role === 'buyer' ? '<span class="mute">Pay the seller, then wait for the code.</span>' : ''}${role === 'seller' && r.s !== 'Requested' ? acts(r) : ''}${role === 'buyer' && (r.s === 'Code released' || r.s === 'Completed') ? `Code: <b>${esc(L.find(x => x.id === r.lid).code || 'Not provided')}</b>` : ''}</td></tr>` }).join('')}</table></div>`
        }
        function list() {
            let r = approved().filter(l => (S.cat === 'All' || l.cat === S.cat) && (!S.typ || S.typ === 'all' || l.type === S.typ) && (!S.exp || S.exp === 'all' || days(l.exp) <= +S.exp) && (l.brand + l.off + l.type).toLowerCase().includes(S.q.toLowerCase())); if (S.sort === 'price') r.sort((a, b) => a.price - b.price); else if (S.sort === 'new') r.sort((a, b) => b.id - a.id); else r.sort((a, b) => days(a.exp) - days(b.exp));
            $('#list').innerHTML = r.length ? r.map(card).join('') : '<p class="mute">No offers match. Try another word or category.</p>'
        }
        function render() { S.view = location.hash.slice(1) || 'home'; if (!V[S.view]) S.view = 'home'; nav(); $('#app').innerHTML = V[S.view](); if (S.view === 'explore') list(); window.scrollTo(0, 0) }
        function detail(id) {
            const l = L.find(x => x.id === id), d = days(l.exp);
            $('#dlg').innerHTML = `<h2 style="margin-top:0">${esc(l.brand)}: ${esc(l.off)}</h2><div class="row"><span class="pill">${l.type}</span><span class="pill ${d <= 14 ? 'warn' : 'ok'}">Expires ${l.exp}</span></div>
<p><b>${inr(l.price)}</b> · Seller ${esc(l.seller)}</p><p class="mute">Minimum spend: ${l.min ? inr(l.min) : 'none'}<br>Eligible: ${esc(l.elig)}<br>Listed after admin review of eligibility details. Review does not guarantee redemption. The code is shared only after the seller accepts.</p>
<div class="note">A purchase request is not a payment and not proof of transfer. Savezy processes no payment in this version.</div>
<div class="row"><button class="btn" onclick="request('${esc(String(id))}')">Send purchase request</button><button class="btn alt" onclick="save('${esc(String(id))}')">${S.wish.has(id) ? 'Remove from saved' : 'Save'}</button><button class="btn alt" onclick="report('${esc(String(id))}')">Report</button><button class="btn alt" onclick="$('#dlg').close()">Close</button></div>`; $('#dlg').showModal()
        }
        function authDlg() {
            $('#dlg').innerHTML = `
                <h2 style="margin-top:0">Savezy Account</h2>
                <label>Name (for registration)<input id="an" autocomplete="name" maxlength="60"></label>
                <label>Email<input id="ae" type="email" autocomplete="email"></label>
                <label>Password<input id="ap" type="password" autocomplete="current-password"></label>
                <div class="row" style="margin-top:14px">
                    <button class="btn" onclick="registerUser()">Register</button>
                    <button class="btn alt" onclick="login()">Login</button>
                </div>
                <p style="margin-top:12px"><button class="btn alt sm" onclick="forgotPassword()">Forgot password?</button></p>
                <button class="btn bad sm" onclick="$('#dlg').close()">Cancel</button>
            `;
            $('#dlg').showModal();
        }

        async function registerUser() {
            try {
                const name = $('#an').value.trim();
                const email = $('#ae').value.trim();
                const password = $('#ap').value;

                if (!name || !email || !password) return toast('Fill all fields');
                if (name.length > 60) return toast('Name must be 60 characters or less');
                if (password.length < 6) return toast('Password must have at least 6 characters');

                await window.savezyAuth.register(name, email, password);
                $('#dlg').close();
                toast('Registration successful!');
            } catch (error) {
                console.error('Registration error:', error);
                toast(error.message || 'Registration failed');
            }
        }

        async function login() {
            try {
                const email = $('#ae').value.trim();
                const password = $('#ap').value;

                if (!email || !password) return toast('Enter email and password');

                await window.savezyAuth.login(email, password);
                $('#dlg').close();
                toast('Login successful!');
            } catch (error) {
                console.error('Login error:', error);
                toast(error.message || 'Login failed');
            }
        }

        async function logout() {
            try {
                await window.savezyAuth.logout();
                toast('Logged out successfully');
            } catch (error) {
                console.error('Logout error:', error);
                toast(error.message || 'Logout failed');
            }
        }

        async function forgotPassword() {
            try {
                const email = $('#ae').value.trim();
                if (!email) return toast('Enter your email first');
                await window.savezyAuth.resetPassword(email);
                toast('Password reset email sent');
            } catch (error) {
                console.error('Password reset error:', error);
                toast(error.message || 'Password reset failed');
            }
        }
        function need() { if (S.user) return true; $('#dlg').close(); authDlg(); return false }
        function request(id) {
            if (!need()) return; const l = L.find(x => x.id === id); if (l.seller === S.user.name) return toast('You cannot request your own listing');
            if (S.reqs.some(r => r.lid === id && r.buyer === S.user.name && r.s !== 'Declined')) return toast('You already sent a request for this offer'); S.reqs.push({ id: Date.now(), lid: id, buyer: S.user.name, s: 'Requested' }); $('#dlg').close(); toast('Request sent. The seller will see it under Requests.')
        }
        function save(id) { S.wish.has(id) ? S.wish.delete(id) : S.wish.add(id); $('#dlg').close(); toast(S.wish.has(id) ? 'Saved' : 'Removed from saved') }
        function report(id) { const why = prompt('What is wrong with this listing?'); if (!why) return; S.reports.push({ id: Date.now(), lid: id, why }); $('#dlg').close(); toast('Report sent to admin') }
        function setReq(id, s) { S.reqs.find(r => r.id === id).s = s; toast('Status: ' + s); render() }
        async function submitSell() {
            if (!S.user) { authDlg(); return; }

            const button = document.querySelector('button[onclick="submitSell()"]');
            const v = selector => $(selector).value.trim();
            const brand = v('#sb');
            const offer = v('#so');
            const price = Number(v('#sp'));
            const expiresOn = v('#se');
            const category = $('#sc').value;
            const kind = $('#st').value;
            const minSpend = Number(v('#sm') || 0);
            const conditions = v('#sx') || 'Not specified';
            const evidence = v('#sv');
            const code = v('#scode');

            if (!brand || !offer || !price || !expiresOn) {
                return toast('Fill in brand, discount, price and expiry');
            }
            if (brand.length > 80 || offer.length > 80) {
                return toast('Brand and offer must be 80 characters or less');
            }
            if (!Number.isFinite(price) || price <= 0) {
                return toast('Enter a valid selling price');
            }
            if (!Number.isFinite(minSpend) || minSpend < 0) {
                return toast('Enter a valid minimum spend');
            }
            if (conditions.length > 500) {
                return toast('Conditions must be 500 characters or less');
            }
            if (days(expiresOn) < 1) {
                return toast('Expiry date must be in the future');
            }
            if (BLOCKED.includes(kind)) {
                return toast('This kind of offer is tied to an account or card and cannot be listed');
            }
            if (!TYPES.includes(kind)) {
                return toast('Choose an eligible voucher type');
            }
            if (!$('#sk').checked || !$('#sk2').checked || !$('#sk3').checked) {
                return toast('Tick all three confirmations to continue');
            }
            if (evidence.length < 10 || evidence.length > 500) {
                return toast('Evidence must be between 10 and 500 characters');
            }
            if (!code || code.length > 200) {
                return toast('Enter a voucher code (maximum 200 characters)');
            }

            if (!window.savezyAuth || typeof window.savezyAuth.createListing !== 'function') {
                return toast('Firebase listing service is not loaded. Refresh and try again.');
            }

            try {
                if (button) {
                    button.disabled = true;
                    button.textContent = 'Submitting…';
                }

                const result = await window.savezyAuth.createListing({
                    brand,
                    category,
                    kind,
                    offer,
                    price,
                    expiresOn,
                    minSpend,
                    conditions,
                    evidence,
                    code
                });

                // Keep only non-sensitive public listing fields in the local UI cache.
                // Never put evidence or voucher code into localStorage.
                L.push({
                    id: result.id,
                    brand,
                    cat: category,
                    type: kind,
                    off: offer,
                    price,
                    exp: expiresOn,
                    min: minSpend,
                    elig: conditions,
                    seller: S.user.name,
                    sellerId: S.user.uid,
                    st: 'pending'
                });

                toast('Coupon submitted for admin review');
                go('dashboard');
            } catch (error) {
                console.error('Firestore coupon submission failed:', error);
                toast(error.message || 'Could not submit coupon. Please try again.');
            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = 'Submit for review';
                }
            }
        }
        function mark(id, a) { const key = String(id); if (a === 'del') { if (!confirm('Remove this listing?')) return; L = L.filter(l => String(l.id) !== key); S.reqs = S.reqs.filter(r => String(r.lid) !== key) } else { const listing = L.find(l => String(l.id) === key); if (!listing) return toast('Listing not found'); listing.st = a; } toast(a === 'del' ? 'Listing removed' : 'Marked as sold'); render() }
        async function review(id, ok) {
            if (!S.admin) return toast('Admin access required');
            try {
                await window.savezyAuth.updateListingStatus(String(id), ok ? 'approved' : 'rejected');
                toast(ok ? 'Coupon approved and now live' : 'Coupon rejected');
            } catch (error) {
                console.error('Admin review failed:', error);
                toast(error.message || 'Could not update listing');
            }
        }
        function takedown(rid) { const r = S.reports.find(x => x.id === rid); L = L.filter(l => l.id !== r.lid); S.reqs = S.reqs.filter(q => q.lid !== r.lid); S.reports = S.reports.filter(x => x.lid !== r.lid); toast('Listing taken down'); render() }
        function dismiss(rid) { S.reports = S.reports.filter(x => x.id !== rid); toast('Report dismissed'); render() }
        try { const d = JSON.parse(localStorage.getItem('sz1')); if (d) { S.reqs = d.reqs || []; S.wish = new Set(d.wish || []); S.reports = d.reports || []; } } catch (e) { console.error('Local storage error:', e) }

        let stopApprovedListings = null;
        let stopPendingListings = null;

        function startApprovedListener() {
            if (stopApprovedListings) stopApprovedListings();
            stopApprovedListings = window.savezyAuth.subscribeListings('approved', (rows, error) => {
                if (error) { console.error('Approved listings listener:', error); return; }
                L = rows;
                render();
            });
        }

        function startPendingListener() {
            if (stopPendingListings) stopPendingListings();
            stopPendingListings = null;
            P = [];
            if (!S.admin) return;
            stopPendingListings = window.savezyAuth.subscribePendingListings((rows, error) => {
                if (error) { console.error('Pending listings listener:', error); toast('Could not load pending listings'); return; }
                P = rows;
                if (S.view === 'admin') render();
            });
        }

        window.addEventListener('savezy-auth-ready', () => {
            startApprovedListener();
            window.savezyAuth.listenAuth(async (user) => {
                if (stopPendingListings) stopPendingListings();
                stopPendingListings = null;
                S.admin = false;
                P = [];
                if (user) {
                    try {
                        const profile = await window.savezyAuth.getUserProfile(user.uid);
                        S.user = { uid: user.uid, name: profile.name, email: user.email };
                        S.admin = await window.savezyAuth.checkAdmin(user.uid);
                    } catch (error) {
                        console.error('User profile/admin check error:', error);
                        S.user = { uid: user.uid, name: user.email || 'User', email: user.email };
                    }
                } else {
                    S.user = null;
                }
                startPendingListener();
                render();
            });
        });


        addEventListener('hashchange', render); render();
    </script>
</body>
</html>
